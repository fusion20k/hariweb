<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Connecting… | Hari</title>
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <style>
        body { font-family: Inter, system-ui, sans-serif; background: #f7f5f0; color: #1a1a1a; display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 16px; }
        main { max-width: 460px; text-align: center; }
        code { display: block; word-break: break-all; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 10px; margin: 12px 0; font-size: 12px; text-align: left; }
        button { background: #0f766e; color: #fff; border: 0; border-radius: 999px; padding: 8px 18px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <h1>Connecting your account…</h1>
        <p id="msg">Sending you back to the Hari Growth app on your computer.</p>
        <div id="fallback" hidden>
            <p>If the app didn't open, copy this address and paste it into Settings → Connected accounts:</p>
            <code id="url"></code>
            <button id="copy" type="button">Copy</button>
        </div>
    </main>
    <script>
        // OAuth relay for the local Hari Growth app. TikTok, Instagram and Threads only allow https
        // redirect URLs, so they land here and this page forwards the code to localhost.
        // Nothing is stored or sent anywhere else.
        (function () {
            var params = new URLSearchParams(location.search);
            var platform = (params.get("state") || "").split(".")[0];
            var allowed = ["tiktok", "instagram", "threads"];
            var full = location.href;
            document.getElementById("url").textContent = full;
            document.getElementById("copy").onclick = function () {
                navigator.clipboard && navigator.clipboard.writeText(full);
                this.textContent = "Copied";
            };
            if (allowed.indexOf(platform) === -1 || !(params.get("code") || params.get("error"))) {
                document.getElementById("msg").textContent = "This page is used when connecting accounts in the Hari Growth app.";
                return;
            }
            setTimeout(function () { document.getElementById("fallback").hidden = false; }, 2500);
            location.replace("http://localhost:3000/api/auth/" + platform + "/callback" + location.search);
        })();
    </script>
</body>
</html>
