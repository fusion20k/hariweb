<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="leafBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A2420"/>
      <stop offset="100%" stop-color="#071815"/>
    </linearGradient>
    <linearGradient id="leafMid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#11857A"/>
      <stop offset="100%" stop-color="#0B5C56"/>
    </linearGradient>
    <linearGradient id="leafMid2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#0A4A45"/>
    </linearGradient>
    <linearGradient id="leafFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5FE8CF"/>
      <stop offset="100%" stop-color="#1FAF9A"/>
    </linearGradient>
    <linearGradient id="leafGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E4C57E"/>
      <stop offset="100%" stop-color="#C9A961"/>
    </linearGradient>

    <!-- broad oval leaf, tip up, base down -->
    <path id="leafOval" d="M0,-150 C42,-118 58,-46 52,18 C48,78 22,128 0,152 C-22,128 -48,78 -52,18 C-58,-46 -42,-118 0,-150 Z"/>
    <!-- vein for oval leaf -->
    <path id="leafOvalVein" d="M0,-138 C6,-60 6,60 0,140" stroke-width="2.5" fill="none"/>

    <!-- long curved canna / bird-of-paradise leaf -->
    <path id="leafCanna" d="M0,-180 C34,-146 46,-70 40,0 C36,66 20,142 0,180 C-12,112 -22,46 -19,-22 C-16,-96 -20,-150 0,-180 Z"/>
    <path id="leafCannaVein" d="M0,-168 C8,-80 2,60 -2,168" stroke-width="2.2" fill="none"/>

    <!-- fern frond: stem + alternating leaflets -->
    <g id="frond">
      <path d="M0,160 C2,80 0,-40 0,-190" stroke-width="3" fill="none"/>
      <ellipse cx="14" cy="120" rx="26" ry="9" transform="rotate(-30 14 120)"/>
      <ellipse cx="-14" cy="98" rx="26" ry="9" transform="rotate(30 -14 98)"/>
      <ellipse cx="15" cy="72" rx="24" ry="8.5" transform="rotate(-32 15 72)"/>
      <ellipse cx="-15" cy="50" rx="24" ry="8.5" transform="rotate(32 -15 50)"/>
      <ellipse cx="14" cy="24" rx="22" ry="8" transform="rotate(-34 14 24)"/>
      <ellipse cx="-14" cy="2" rx="22" ry="8" transform="rotate(34 -14 2)"/>
      <ellipse cx="13" cy="-22" rx="19" ry="7" transform="rotate(-36 13 -22)"/>
      <ellipse cx="-13" cy="-44" rx="19" ry="7" transform="rotate(36 -13 -44)"/>
      <ellipse cx="12" cy="-68" rx="16" ry="6" transform="rotate(-38 12 -68)"/>
      <ellipse cx="-12" cy="-90" rx="16" ry="6" transform="rotate(38 -12 -90)"/>
      <ellipse cx="10" cy="-112" rx="13" ry="5" transform="rotate(-40 10 -112)"/>
      <ellipse cx="-10" cy="-132" rx="13" ry="5" transform="rotate(40 -10 -132)"/>
      <ellipse cx="8" cy="-152" rx="10" ry="4" transform="rotate(-42 8 -152)"/>
      <ellipse cx="-8" cy="-170" rx="8" ry="3.4" transform="rotate(42 -8 -170)"/>
    </g>

    <!-- small star flower -->
    <g id="flowerStar">
      <ellipse cx="0" cy="-16" rx="7" ry="16"/>
      <ellipse cx="0" cy="-16" rx="7" ry="16" transform="rotate(72)"/>
      <ellipse cx="0" cy="-16" rx="7" ry="16" transform="rotate(144)"/>
      <ellipse cx="0" cy="-16" rx="7" ry="16" transform="rotate(216)"/>
      <ellipse cx="0" cy="-16" rx="7" ry="16" transform="rotate(288)"/>
      <circle r="6"/>
    </g>

    <!-- simple bird in flight -->
    <path id="bird" d="M-46,0 C-30,-18 -12,-20 0,-9 C12,-20 30,-18 46,0 C28,-5 12,-3 0,5 C-12,-3 -28,-5 -46,0 Z"/>
  </defs>

  <!-- ============ BACK LAYER (darkest, largest) ============ -->
  <g opacity="0.92" fill="url(#leafBack)">
    <use href="#leafOval" transform="translate(760,560) rotate(18) scale(2.15)"/>
    <use href="#leafCanna" transform="translate(880,430) rotate(-10) scale(1.7)"/>
    <use href="#leafOval" transform="translate(640,680) rotate(-28) scale(1.6)"/>
  </g>

  <!-- ============ MID LAYER ============ -->
  <g fill="url(#leafMid2)">
    <use href="#leafCanna" transform="translate(700,610) rotate(12) scale(1.35)"/>
    <use href="#leafOval" transform="translate(850,300) rotate(34) scale(1.1)"/>
  </g>

  <g fill="url(#leafMid)">
    <use href="#leafOval" transform="translate(600,420) rotate(-16) scale(1.05)"/>
    <use href="#leafCanna" transform="translate(810,620) rotate(-22) scale(1.15)"/>
    <use href="#leafOval" transform="translate(500,250) rotate(8) scale(0.78)"/>
  </g>
  <g stroke="#06302C" opacity="0.55">
    <use href="#leafOvalVein" transform="translate(600,420) rotate(-16) scale(1.05)"/>
    <use href="#leafCannaVein" transform="translate(810,620) rotate(-22) scale(1.15)"/>
  </g>

  <!-- fronds, mid tone -->
  <g fill="#0B5C56" stroke="#0B5C56">
    <use href="#frond" transform="translate(900,520) rotate(14) scale(1.3)"/>
    <use href="#frond" transform="translate(560,560) rotate(-8) scale(1.05)"/>
  </g>

  <!-- ============ FRONT / HIGHLIGHT LAYER ============ -->
  <g fill="url(#leafFront)">
    <use href="#leafOval" transform="translate(720,480) rotate(-34) scale(0.72)"/>
    <use href="#leafCanna" transform="translate(620,340) rotate(20) scale(0.62)"/>
    <use href="#leafOval" transform="translate(860,640) rotate(44) scale(0.6)"/>
  </g>
  <g fill="#1FAF9A" stroke="#1FAF9A">
    <use href="#frond" transform="translate(770,350) rotate(-4) scale(0.7)"/>
  </g>

  <g fill="url(#leafGold)">
    <use href="#flowerStar" transform="translate(655,470) scale(1.05)"/>
    <use href="#flowerStar" transform="translate(830,560) scale(0.8)"/>
    <use href="#flowerStar" transform="translate(745,620) scale(0.65)"/>
  </g>

  <!-- wildlife accent -->
  <g fill="#F3E6C4" opacity="0.9">
    <use href="#bird" transform="translate(520,160) rotate(-6) scale(1.1)"/>
  </g>
  <g fill="#E4C57E" opacity="0.6">
    <use href="#bird" transform="translate(640,95) rotate(4) scale(0.7)"/>
  </g>

  <!-- ============ BRIDGE SPRIGS (sparse, left of the main cluster) ============ -->
  <g opacity="0.5" fill="url(#leafMid)">
    <use href="#leafOval" transform="translate(290,560) rotate(-20) scale(0.55)"/>
  </g>
  <g opacity="0.4" fill="#0B5C56" stroke="#0B5C56">
    <use href="#frond" transform="translate(360,430) rotate(10) scale(0.6)"/>
  </g>
  <g opacity="0.45" fill="url(#leafMid2)">
    <use href="#leafCanna" transform="translate(220,330) rotate(-14) scale(0.4)"/>
  </g>
  <g opacity="0.55" fill="url(#leafGold)">
    <use href="#flowerStar" transform="translate(330,610) scale(0.45)"/>
  </g>
</svg>
